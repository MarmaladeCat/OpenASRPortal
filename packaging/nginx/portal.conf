map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Never log query strings: WS credentials are carried in a one-time ticket.
log_format portal '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
    access_log /var/log/nginx/access.log portal;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log portal;
    # NGINX error diagnostics can include the full request URI (and ticket).
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $portal http://portal:10087;
        proxy_pass $portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_next_upstream off;
    }
}
